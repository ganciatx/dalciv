# Hostinger VPS — Docker Manager / hostinger/deploy-on-vps (see HOSTINGER_DEPLOY_PLAN.md).
# Public HTTP/HTTPS is handled by Caddy; the app listens only on the internal network.
services:
  caddy:
    build: ./deploy/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sivic:
        condition: service_healthy
      tally:
        condition: service_started
      problem-frame:
        condition: service_healthy

  sivic:
    build: .
    expose:
      - "8765"
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8765"
      SCRAPER_ENABLED: "${SCRAPER_ENABLED:-0}"
      SOCRATA_APP_TOKEN: "${SOCRATA_APP_TOKEN:-}"
      OPS_API_TOKEN: "${OPS_API_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}"
      DATA_SYNC_ENABLED: "${DATA_SYNC_ENABLED:-1}"
    volumes:
      - sivic_data:/app/scraper_dashboard_data
      - sivic_downloads:/app/dallas_legistar_downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  tally:
    build: ./deploy/tally
    expose:
      - "80"
    restart: unless-stopped

  # Problem Frame — Next.js standalone + SQLite, served at frames.ganciatx.com.
  # Source vendored from the Problem Frame repo into apps/problem-frame.
  problem-frame:
    build:
      context: ./apps/problem-frame
      args:
        # NEXT_PUBLIC_* is inlined at build time, so the public URL is baked here.
        NEXT_PUBLIC_APP_URL: "https://frames.ganciatx.com"
    expose:
      - "3000"
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      BETTER_AUTH_URL: "https://frames.ganciatx.com"
      NEXT_PUBLIC_APP_URL: "https://frames.ganciatx.com"
      DATABASE_PATH: "/app/data/app.db"
    volumes:
      - problem_frame_data:/app/data
    restart: unless-stopped
    healthcheck:
      # Slim image has no curl; use Node's global fetch instead.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sivic_data:
  sivic_downloads:
  caddy_data:
  caddy_config:
  problem_frame_data:
