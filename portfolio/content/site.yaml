services:
  - title: Product Management
    description: >-
      Discovering products that are valuable, feasible, and usable by bridging
      business, tech, and design.
  - title: Turning Insight Into Growth
    description: >-
      Eventually all the research, the data, and the customer feedback has to turn into something — a message, a strategy, a reason someone picks you over the other option.
  - title: MVPs & Validation
    description: >-
      Running lean experiments and smoke tests to validate ideas before investing
      in full builds.
  - title: Simplifying Complexity
    description: >-
      Tax prep, compliance workflows, B2B onboarding — my specialty is taking the
      stuff nobody wants to deal with and making it slightly less painful.
  - title: Rapid Prototyping
    description: >-
      Shipping functional prototypes in days, not months, to test assumptions with
      real users.
  - title: Reading the Business
    description: >-
      I have an accounting degree, which mostly means I ask annoying questions about
      what we're actually measuring before we build anything.

